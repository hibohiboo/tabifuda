# システム境界レイヤー: 画面
# 出典の正: design/domain-guide.md「3. 1プレイの流れ」「6. 権限」、
# design/ui-visual-design.md、design/domain-model.md「セッション終了処理」。
# status: implemented(実装済み) | future(未作成。一目で分かるように区別する)
# layout: ワイヤーフレーム(段階2)。枠+ラベルの簡易ボックスをスマホ幅で
# 縦に積む想定。各要素は label(表示ラベル)/ sizeHint(small|medium|large。
# 縦積み時の高さ比の目安)を持つ。ピクセル精度のデザインではなく、画面の
# 構成要素と大まかな比重を確認するためのもの。
# 経緯: 2026-08-02の進め方見直し
# (tasks/plans/post-p3.5-replanning-decisions.md Q6)。
screens:
  - id: scenario-select
    name: 依頼選択
    status: future
    actors: [gm]
    usecases: [start-session]
    description: >-
      遊ぶシナリオ(依頼)を選ぶ画面。StartSessionを呼んだ本人がそのまま
      セッションのGmとして登録されるため(domain-model.md「セッション開始」)、
      この画面の操作者はGm。現状は apps/web にシナリオ選択UIが無く、
      単一シナリオ(simpleHunt)を決め打ちで開始する。将来は張り紙カードから
      選ぶ形にしたい(2026-08-02決定)。ソロMVPでは1人がPlayerとGmを兼ねる
      ため実質同一人物が操作する(domain-guide.md「6. 権限」)。
    source: design/domain-guide.md#3-1プレイの流れテンプレシナリオ単純討伐
    layout:
      - label: ヘッダー(タイトル)
        sizeHint: small
      - label: 依頼カード一覧(張り紙。グリッド表示)
        sizeHint: large
      - label: 選択して始めるボタン
        sizeHint: small

  - id: in-scenario-play
    name: シナリオ中(プレイ画面)
    status: implemented
    actors: [player, gm]
    usecases: [play-card, propose, judge-proposal, apply-patch, gm-advance]
    description: >-
      実装済み(apps/web)。手札からカードを出す・提案する・GM裁定パネルを
      表示する。現状は冒険記タイムラインも同一画面に表示しているが、
      別画面(chronicle-timeline)へ分離したい(2026-08-02レビュー指摘)。
    source: design/ui-visual-design.md#手札選択プレイ中の操作画面
    layout:
      - label: シーン本文(narration)
        sizeHint: large
      - label: GM裁定パネル(Paused中のみ表示)
        sizeHint: medium
      - label: 手札(横スクロールのカード列)
        sizeHint: medium
      - label: 提案入力
        sizeHint: small

  - id: chronicle-timeline
    name: 冒険記タイムライン(プレイ中の別画面)
    status: future
    actors: [player, gm]
    usecases: []
    description: >-
      セッション中の出来事(Event列)を時系列で振り返る画面。現状は
      in-scenario-play画面の下に同居しているが、プレイ操作画面とは分けた
      専用画面にしたい(2026-08-02レビュー指摘。スマホでの見やすさが動機)。
      表示するのはCommandではなくchronicle(情報モデル)。
    source: design/ui-visual-design.md#冒険記セッションのイベントログ
    layout:
      - label: ヘッダー(戻る)
        sizeHint: small
      - label: タイムライン(フェーズの山→開くとイベントのリスト)
        sizeHint: large

  - id: post-scenario
    name: シナリオ終了後
    status: future
    actors: [player, gm]
    usecases: [end-session]
    description: >-
      現状は勝敗の一行表示のみ(専用画面が無い)。CLI版にあるフォーク保存
      (future-requirements.md §7)や結果まとめをWeb版でも見せたい。
    source: design/domain-model.md#セッション終了処理finalize
    layout:
      - label: 結果(勝利/敗北)
        sizeHint: small
      - label: 冒険記サマリ
        sizeHint: medium
      - label: フォーク保存ボタン
        sizeHint: small

  - id: author-page
    name: 作者ページ
    status: future
    actors: [author]
    usecases: []
    description: >-
      シナリオ作者向けの画面は未着手。現状シナリオはJSON/Rustコードで
      手書きする。作者はセッション進行のCommandを持たない(domain-guide.md)。
    source: design/domain-guide.md#6-権限-誰が何をできるか
    layout:
      - label: シナリオ一覧・新規作成
        sizeHint: medium
      - label: 編集(フェーズ・シーン・カード)
        sizeHint: large

  - id: gm-page
    name: GMページ
    status: future
    actors: [gm]
    usecases: [judge-proposal, apply-patch, gm-advance, end-session]
    description: >-
      非同期マルチプレイ(P4、凍結中)向けのGM専用画面は未着手。1人のGMが
      複数セッションを並行管理する想定(2026-08-02、docs-site D4画面
      レビューで指摘)。ソロMVPではGM操作もシナリオ中プレイ画面
      (in-scenario-play)に統合されている。
    source: design/domain-guide.md#6-権限-誰が何をできるか
    layout:
      - label: 進行中セッション一覧(複数を並行管理)
        sizeHint: small
      - label: 参加者一覧・状態(選択中セッション)
        sizeHint: medium
      - label: 提案の裁定キュー(選択中セッション)
        sizeHint: medium
      - label: 強制進行・強制終了の操作(選択中セッション)
        sizeHint: small

  - id: gm-scenario-stock
    name: シナリオ管理・カスタマイズ
    status: future
    actors: [gm]
    usecases: []
    description: >-
      GMが複数シナリオをストックし、繰り返し使えるようカスタマイズする画面
      (2026-08-02、docs-site D4画面レビューで発見)。現行のApplyPatchは
      セッション中(Paused)のみが対象で、セッション開始前のカスタマイズを
      表すCommandが無い(未モデル化。P4着手時に検討)。
    source: requirements/future-requirements.md#1-セッションの中断と並行プレイ
    layout:
      - label: シナリオ在庫一覧
        sizeHint: medium
      - label: カスタマイズ(パッチ編集)
        sizeHint: large
      - label: 募集へ進むボタン
        sizeHint: small

  - id: session-recruit
    name: セッション募集
    status: future
    actors: [gm]
    usecases: []
    description: >-
      カスタマイズ済みシナリオでプレイヤーを募る画面(2026-08-02、docs-site
      D4画面レビューで発見)。StartSessionはパーティが確定済みであることを
      前提に呼ばれるため、「募集中(参加者未確定)」の中間状態を表現できない
      (未モデル化。P4着手時に募集用の新Commandを検討)。
    source: requirements/future-requirements.md#1-セッションの中断と並行プレイ
    layout:
      - label: 募集シナリオの詳細
        sizeHint: medium
      - label: 集まった参加者一覧
        sizeHint: medium
      - label: プレイ開始ボタン
        sizeHint: small
