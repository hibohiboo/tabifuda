# システム価値レイヤー: 要求
# status: realized(実装済みの価値) | future(将来要望。docs/requirements/future-requirements.md
# は「実装済みと誤認しないこと」と明記している非規範メモのため、ここでも
# 明確に区別する)
requirements:
  - id: play-tabletop-solo
    name: 一人でもTRPG風のカード進行を遊びたい
    status: realized
    actors: [player, gm]
    description: GM/プレイヤーを1人が兼任してもソロプレイとして成立する。
    source: design/domain-guide.md#1-tabifuda-は何のソフトか

  - id: review-adventure-log
    name: セッション後に何が起きたか振り返りたい
    status: realized
    actors: [player, gm]
    description: Event列(冒険記)として記録され、決定的にリプレイできる。
    source: design/domain-model.md#コマンドとイベント

  - id: propose-beyond-script
    name: 台本にない行動を提案したい
    status: realized
    actors: [player]
    description: Proposalカードで提案でき、GMの裁定を経て安全に取り込める。
    source: design/domain-guide.md#5-gmの介入-提案休止パッチ

  - id: improvise-safely
    name: 台本を安全に即興改編したい
    status: realized
    actors: [gm]
    description: 構造化パッチ(ScenarioPatch)は適用前にvalidateされ、壊れた改編は拒否される。
    source: design/domain-model.md#シナリオパッチ構造化

  - id: pause-and-resume
    name: セッションを中断し、後で再開したい
    status: realized
    actors: [player]
    description: >-
      実装済み(phase3.5 C1)。Paused中を含め中断保存→再開で通しプレイ可能。
      複数セッションファイルによる並行プレイも成立する。
    source: design/domain-model.md#セッションの保存と再開cliの決定規範ではない

  - id: take-rewards-home
    name: クリア報酬を持ち帰りたい
    status: realized
    actors: [player]
    description: >-
      実装済み(phase3.5 C3-C4)。portableなカードを持ち帰りパーティファイルへ
      書き戻す。作者が明示定義する報酬(rewards)は未実装で将来要望に残る。
    source: design/domain-model.md#セッション終了処理finalize

  - id: protect-scenario-secrets
    name: 持ち出されたくないアイテムを守りたい
    status: realized
    actors: [author]
    description: >-
      実装済み(phase3.5 C3)。持ち出しは既定不可・カード側の#portableタグで
      opt-in。Markerカードは常に持ち出し不可。
    source: design/domain-model.md#持ち出し可否portable

  - id: reuse-cards-across-scenarios
    name: カードをタグで疎結合に再利用したい
    status: future
    actors: [author]
    description: >-
      カード作者は用途を知らずにタグを付け、シナリオ作者はカードを知らずに
      タグで受ける仕組みがほしい。
    source: requirements/future-requirements.md#4-カードのタグシステム

  - id: share-fork-back-to-author
    name: GMの改編を作者へ還流したい
    status: future
    actors: [author, gm]
    description: >-
      フォーク(改編済みシナリオ)の差分を作者がレビューし、元シナリオへ
      取り込む流れがほしい(Pull Request相当)。
    source: requirements/future-requirements.md#6-フォーク公開とシナリオ作者への還流

  # 以下D6(2026-08-11)で追加。gm・authorの要求がplayerに比べ手薄だった
  # ことへの対応(経緯: tasks/plans/post-p3.5-session-retrospective.md)。
  - id: create-multiple-parties
    name: 別のパーティを作って遊びたい
    status: future
    actors: [player]
    description: >-
      パーティファイルは手書きJSONとして複数用意できるが、アプリ内で
      キャラメイクし直して新しいパーティを作る手段が無い。
    source: design/domain-model.md#パーティファイルcliの決定規範ではない

  - id: stock-and-customize-scenarios
    name: シナリオを複数ストックし、カスタマイズして繰り返し使いたい
    status: future
    actors: [gm]
    description: >-
      現行のApplyPatchはセッション中(Paused)のみが対象で、セッション開始前に
      シナリオをストック・カスタマイズしておく手段が無い。
    source: requirements/future-requirements.md#1-セッションの中断と並行プレイ

  - id: recruit-players-for-session
    name: プレイヤーを募ってセッションを開始したい
    status: future
    actors: [gm]
    description: >-
      StartSessionはパーティ確定済みが前提のため、「募集中(参加者未確定)」
      という中間状態を表現できない。
    source: requirements/future-requirements.md#1-セッションの中断と並行プレイ

  - id: manage-multiple-sessions
    name: 複数の進行中セッションを並行して管理したい
    status: future
    actors: [gm]
    description: >-
      複数セッションファイルの並行プレイ自体は成立するが、1人のGMが複数の
      進行中セッションを一覧・管理するUI/権限面は未検討。
    source: requirements/future-requirements.md#1-セッションの中断と並行プレイ

  - id: create-and-edit-scenario
    name: シナリオを作りたい/編集したい
    status: future
    actors: [author]
    description: >-
      現状シナリオはJSON/Rustコードとして手書きするしかなく、作者向けの
      専用編集手段(GUI・書式ガイド)が無い。
    source: requirements/future-requirements.md#9-シナリオ作者向けの作成編集手段

  - id: browse-other-scenarios
    name: 他の作者のシナリオを見たい
    status: future
    actors: [author]
    description: >-
      シナリオはローカルファイルとして単独で存在し、他作者のシナリオを
      閲覧する仕組みが無い(P4のサーバ側共有が前提)。
    source: requirements/future-requirements.md#10-シナリオ作者間の共有派生

  - id: copy-scenario-as-base
    name: 他シナリオのベースをコピーして自分のものを作り始めたい
    status: future
    actors: [author]
    description: >-
      既存のフォーク機構(forked_from)はGMの改編保存が目的で、作者が他
      シナリオをベースに新規作成を始める用途は未検討。
    source: requirements/future-requirements.md#10-シナリオ作者間の共有派生

  - id: create-campaign-scenario
    name: キャンペーンシナリオを作りたい
    status: future
    actors: [author]
    description: >-
      前のセッションの攻略実績を参加条件にするキャンペーン構成は未実装
      (シナリオmetaへの`prerequisites`拡張等が必要)。
    source: requirements/future-requirements.md#2-キャンペーンシナリオセッション

  - id: share-world-via-locations
    name: 同じロケーションを使ってシェアワールドを表現したい
    status: future
    actors: [author]
    description: >-
      複数シナリオで同じロケーション(舞台設定)を共有する仕組みが無く、
      ロケーション自体の情報モデルもまだ無い。
    source: requirements/future-requirements.md#10-シナリオ作者間の共有派生

  - id: unlock-authoring-by-rules
    name: ルールを学ぶとシナリオ作成で使える機能が広がってほしい
    status: future
    actors: [author]
    description: >-
      ルールブック(システム提供の固定コンテンツ)を読み進めることに応じて、
      シナリオ作成で使える機能が段階的に開放される体験がほしい。
    source: requirements/future-requirements.md#8-段階的な成長体験ユーザーとしてできることが増えていく

  - id: unlock-character-options-by-rules
    name: ルールを学ぶとキャラクターに設定できることが広がってほしい
    status: future
    actors: [player]
    description: >-
      ルールブックを読み進めることに応じて、キャラメイクで選べる要素が
      段階的に増える体験がほしい。
    source: requirements/future-requirements.md#8-段階的な成長体験ユーザーとしてできることが増えていく
