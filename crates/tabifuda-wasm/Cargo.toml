[package]
name = "tabifuda-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabifuda-core = { path = "../tabifuda-core" }
ts-rs = { version = "12.0.1", optional = true }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
ts = ["dep:ts-rs", "tabifuda-core/ts"]
